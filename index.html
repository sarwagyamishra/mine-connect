<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mine Connect</title>
<style>
:root{--bg:#eef1f4;--cd:#fff;--tx:#141c24;--mu:#5d6c7b;--bd:#d5dce3;--ac:#b57a00;--acb:#f2a900;--r:#d92d3a;--o:#e0790b;--y:#a88a00;--g:#1a8f5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--cd:#1a232d;--tx:#e8edf2;--mu:#93a4b4;--bd:#2a3846;--ac:#f2a900;--acb:#f2a900;--r:#ff5c66;--o:#ff9a3c;--y:#e6c229;--g:#3ccf8e}}
:root[data-theme="dark"]{--bg:#0f151b;--cd:#1a232d;--tx:#e8edf2;--mu:#93a4b4;--bd:#2a3846;--ac:#f2a900;--acb:#f2a900;--r:#ff5c66;--o:#ff9a3c;--y:#e6c229;--g:#3ccf8e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
button{background:var(--acb);color:#141c24;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--r);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acb);outline-offset:2px}
select,input{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:7px 10px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--cd);border-bottom:3px solid var(--acb)}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
nav{display:flex;flex-wrap:wrap;gap:4px;flex:1}nav button{background:transparent;color:var(--mu);border-radius:6px;padding:6px 10px}nav button.on{background:var(--bg);color:var(--tx);box-shadow:inset 0 -2px 0 var(--acb)}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px}
.n{font-size:34px;font-weight:800;line-height:1}.mu{color:var(--mu)}h2{margin:0 0 10px;font-size:18px}h3{margin:0 0 8px;font-size:15px}
.b{display:inline-block;min-width:34px;text-align:center;border-radius:5px;padding:2px 7px;font-weight:700;color:#fff}
.crit{background:var(--r)}.hi{background:var(--o)}.med{background:var(--y)}.low{background:var(--g)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:600;font-size:13px}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.step{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}.step div{flex:1;min-width:88px;text-align:center;padding:8px 4px;border-radius:6px;border:1px solid var(--bd);color:var(--mu);font-size:13px}
.step .dn{background:var(--g);color:#fff;border-color:var(--g)}.step .cu{border-color:var(--acb);color:var(--tx);font-weight:700;box-shadow:0 0 0 2px var(--acb)}
.bar{height:14px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acb)}
.row{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.banner{background:var(--bg);border:1px dashed var(--acb);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--mu);margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:90%;z-index:9;font-weight:600}
.off{background:var(--o);color:#fff}.q{background:var(--r);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
.login{max-width:440px;margin:6vh auto;padding:16px}.login .c{display:grid;gap:10px}
.qd{display:grid;grid-template-columns:1fr 1fr;gap:6px}.wide{overflow-x:auto}
footer{text-align:center;color:var(--mu);font-size:12px;padding:16px}
svg text{fill:var(--tx);font-size:11px}
.pipe{display:flex;gap:6px;flex-wrap:wrap}.pipe span{padding:6px 10px;border-radius:6px;border:1px solid var(--bd);color:var(--mu)}.pipe .on{background:var(--acb);color:#141c24;border-color:var(--acb);font-weight:700}
.cap{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.demo{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--acb);color:#141c24;padding:10px 16px;border-radius:8px;max-width:92%;z-index:10;font-weight:700;box-shadow:0 2px 10px #0006}
</style></head><body><div id="app"></div><div id="tst"></div><div id="dm"></div>
<script>
const W=[.35,.2,.2,.15,.1],FN=['Severity','Recurrence','Personnel proximity','Equipment condition','Overdue compliance'];
const U={manager:'Mine Manager',safety:'Safety Officer',env:'Environmental Officer',equip:'Equipment Officer',auditor:'Auditor',worker:'Worker (Underground)'};
const CA={Emergency:'Evacuate, isolate the zone and take roll-call',Gas:'Ventilation check and gas re-test',PPE:'Toolbox talk and PPE enforcement',Equipment:'Inspect, repair and retest',Compliance:'Close overdue inspection items',Environment:'Water spray and dust suppression'};
const T={en:{dash:'Dashboard',sos:'My safety',map:'Hazard map',tix:'Tickets',sim:'Data simulator',aud:'Audit log',cfg:'Configuration',doc:'Document intelligence',hl:'Data health',nm:'Near-miss report',ho:'Shift handover',out:'Log out',open:'Open risks',crit:'Critical',ovd:'Overdue',cls:'Closed',top:'Top prioritized risks',cat:'Risks by category',qd:'Quick demo login',tag:'AI-based Smart Governance & Compliance Monitoring for Coal Mines',login:'Log in'},
hi:{dash:'डैशबोर्ड',sos:'मेरी सुरक्षा',map:'हैज़र्ड मैप',tix:'टिकट',sim:'डेटा सिमुलेटर',aud:'ऑडिट लॉग',cfg:'कॉन्फ़िगरेशन',doc:'दस्तावेज़ विश्लेषण',hl:'डेटा स्वास्थ्य',nm:'निकट-चूक रिपोर्ट',ho:'शिफ्ट हैंडओवर',out:'लॉग आउट',open:'खुले जोखिम',crit:'गंभीर',ovd:'समय सीमा पार',cls:'बंद',top:'शीर्ष प्राथमिकता जोखिम',cat:'श्रेणी अनुसार जोखिम',qd:'क्विक डेमो लॉगिन',tag:'कोयला खदानों के लिए AI-आधारित स्मार्ट गवर्नेंस एवं अनुपालन निगरानी',login:'लॉग इन'}};
const mk=(id,t,cat,z,x,y,f,eng,ev,st,own,dl,evd,hist)=>({id,t,cat,z,x,y,f,eng,ev,st,own,dl,evd,hist});
const S={u:null,mine:'Mine A',lang:'en',view:'dash',sel:null,off:false,q:0,fails:0,lock:0,sim:-1,toast:'',A:[],n:200,R:[
mk('R-101','Methane above threshold, Panel B','Gas','Panel B',270,85,[.9,.6,.8,.4,.2],'Anomaly detection','sensor',2,'safety',1,0,'3 similar in 30 days'),
mk('R-102','Worker without helmet near haul road','PPE','Haul Road',150,170,[.6,.7,.9,.1,.1],'Computer vision','cv',3,'safety',2,0,'5 similar in 30 days'),
mk('R-103','Conveyor vibration rising, CHP','Equipment','CHP',100,250,[.6,.5,.4,.85,.3],'Anomaly detection','sensor',2,'equip',-1,0,'2 similar in 30 days'),
mk('R-104','Dust level trend above limit, Panel A','Environment','Panel A',80,70,[.6,.7,.5,.2,.4],'Anomaly detection','sensor',4,'env',1,1,'4 similar in 30 days'),
mk('R-105','Inspection report: 3 overdue items','Compliance','Vent Shaft',280,250,[.4,.5,.2,.2,.95],'OCR / NLP','doc',2,'safety',-2,0,'1 similar in 30 days'),
mk('R-106','Fan speed drop, Vent Shaft','Equipment','Vent Shaft',330,240,[.5,.3,.5,.7,.2],'Anomaly detection','sensor',1,'',null,0,'first occurrence'),
mk('R-107','Roof support gap noted on inspection','Compliance','Panel B',330,110,[.7,.3,.7,.3,.5],'OCR / NLP','doc',3,'safety',-1,1,'2 similar in 30 days'),
mk('R-108','Water spray pump idle, Haul Road','Environment','Haul Road',320,170,[.3,.4,.3,.6,.2],'Anomaly detection','sensor',5,'env',-3,1,'1 similar in 30 days')]};
const SIM={meth:['Methane spike, Panel A','Gas','Panel A',90,80,[.95,.5,.7,.3,.1],'Anomaly detection','sensor','2 similar in 30 days'],
helm:['Worker without helmet, Haul Road','PPE','Haul Road',200,172,[.6,.7,.9,.1,.1],'Computer vision','cv','4 similar in 30 days'],
vib:['Conveyor vibration anomaly, CHP','Equipment','CHP',120,255,[.6,.4,.4,.9,.3],'Anomaly detection','sensor','2 similar in 30 days'],
doc:['Inspection report: overdue items found','Compliance','Vent Shaft',270,255,[.4,.5,.2,.2,.95],'OCR / NLP','doc','1 similar in 30 days'],
dust:['Respirable dust above limit, Panel B','Environment','Panel B',320,60,[.7,.6,.6,.2,.3],'Anomaly detection','sensor','3 similar in 30 days']};
const $=id=>document.getElementById(id),t=k=>T[S.lang][k];
const e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
S.P=[['Ramesh K.','Panel A'],['Sunita D.','Panel A'],['Arjun P.','Panel A'],['Mohan L.','Panel B'],['Imran S.','Panel B'],['Geeta R.','Panel B'],['Vikram T.','Panel B'],['Rajesh M.','Haul Road'],['Anita B.','Haul Road'],['Suresh N.','Haul Road'],['Deepak C.','CHP'],['Kavita J.','CHP'],['Harish V.','Vent Shaft'],['Pooja G.','Vent Shaft']].map(([n,z],i)=>({id:'W-'+(i+1),n,z,ok:0}));
const wc=z=>S.P.filter(p=>p.z===z).length,fx=r=>[r.f[0],r.f[1],Math.min(1,wc(r.z)/4),r.f[3],r.f[4]];
const lk=r=>open(r)?S.R.filter(x=>x!==r&&open(x)&&x.z===r.z&&x.cat!==r.cat):[];
const bo=r=>Math.min(16,lk(r).length*8);
const sc=r=>Math.min(100,Math.round(100*fx(r).reduce((a,v,i)=>a+v*W[i],0))+bo(r)+bs(r));
const cmp=z=>new Set(S.R.filter(r=>open(r)&&vis(r)&&r.z===z).map(r=>r.cat)).size>1;
const NODES={'Panel A':[105,70],'Panel B':[295,80],'Haul Road':[200,170],'CHP':[105,250],'Vent Shaft':[295,250],'West Portal':[8,170],'East Portal':[392,170],'Escape Shaft':[295,303],'Service Exit':[105,303]};
const EXITS=['West Portal','East Portal','Escape Shaft','Service Exit'];
const EDG=[['Panel A','Haul Road'],['Panel B','Haul Road'],['Panel A','Panel B'],['CHP','Haul Road'],['Vent Shaft','Haul Road'],['CHP','Vent Shaft'],['Haul Road','West Portal'],['Haul Road','East Portal'],['Vent Shaft','Escape Shaft'],['CHP','Service Exit']];
function route(z0){z0=z0||(S.em&&S.em.z);if(!z0)return null;const bad=new Set(S.R.filter(r=>open(r)&&r.cat!=='Emergency'&&sc(r)>=75).map(r=>r.z));bad.delete(z0);if(S.nd&&S.nd.k==='rain'){bad.add('West Portal');bad.add('East Portal')}
const d={[z0]:0},pr={},Q=[z0],dn=new Set();
while(Q.length){Q.sort((a,b)=>d[a]-d[b]);const u=Q.shift();if(dn.has(u))continue;dn.add(u);
if(EXITS.includes(u)){const p=[u];let c=u;while(pr[c]){c=pr[c];p.unshift(c)}return p}
EDG.forEach(([a,b])=>{const v=a===u?b:b===u?a:null;if(!v||bad.has(v)||dn.has(v))return;const w=Math.hypot(NODES[u][0]-NODES[v][0],NODES[u][1]-NODES[v][1]);if(d[v]===undefined||d[u]+w<d[v]){d[v]=d[u]+w;pr[v]=u;Q.push(v)}})}
return []}
function routeTxt(){const p=route();return p&&p.length?'Safe evacuation route: '+p.join(' → ')+' (avoids critical zones, simulated layout).':'No safe route: every exit path crosses a critical zone. Use refuge chamber and control-room radio.'}
function routeSvg(){const p=route();return EXITS.map(x=>`<rect x="${NODES[x][0]-6}" y="${NODES[x][1]-6}" width="12" height="12" fill="var(--g)"/>`).join('')+(p&&p.length?`<polyline fill="none" stroke="var(--g)" stroke-width="5" stroke-dasharray="8 5" stroke-linecap="round" points="${p.map(n=>NODES[n].join(',')).join(' ')}"/><text x="${Math.max(4,Math.min(330,NODES[p[p.length-1]][0]-30))}" y="${NODES[p[p.length-1]][1]-10}">${p[p.length-1]}</text>`:'')}
function mvw(){const Z=Object.keys(ZC);for(let i=0;i<3;i++){S.P[Math.random()*S.P.length|0].z=Z[Math.random()*Z.length|0]}log('Worker tag movement (simulated)');say('Tag readings updated. Scores recalculated.')}
function safe(id){if(S.u!=='manager'&&S.u!=='safety')return say('Only the Manager or Safety Officer can update the roll-call.');const p=S.P.find(x=>x.id===id);p.ok=p.ok?0:1;p.at=p.ok?Date.now():0;log('Roll-call: '+p.n+(p.ok?' marked safe':' marked unaccounted'));render()}
function cz(){const g={};S.R.filter(r=>open(r)&&vis(r)).forEach(r=>(g[r.z]=g[r.z]||[]).push(r));const L=Object.entries(g).filter(([z,a])=>new Set(a.map(r=>r.cat)).size>1);return `<div class="c" style="margin-top:12px"><h3>Compound-risk zones</h3>${L.map(([z,a])=>`<p style="margin:0 0 6px"><b>${z}</b>: ${a.map(r=>`<a href="#" onclick="pick('${r.id}');return false" style="color:var(--ac)">${e(r.id)}</a> ${r.cat}`).join(' + ')}</p>`).join('')||'<p class="mu" style="margin:0">No zone has overlapping hazards.</p>'}</div>`}
const cl=s=>s>=75?'crit':s>=55?'hi':s>=35?'med':'low';
const bd=r=>`<span class="b ${cl(sc(r))}">${sc(r)}</span>`;
const ST=['','Explained','Assigned','In correction','Pending verification','Closed'];
const open=r=>r.st<5,ovd=r=>open(r)&&r.dl!==null&&r.dl<0;
const due=r=>r.dl===null?'-':r.dl<0?`overdue ${-r.dl}d`:`due in ${r.dl}d`;
const ACC={manager:['dash','map','tix','nm','sim','doc','cfg','aud'],safety:['tix','dash','map','nm','doc'],env:['tix','dash','map','nm','doc'],equip:['tix','dash','map','nm','doc'],auditor:['aud','dash','tix'],worker:['sos']};
const CATS={safety:['Gas','PPE','Compliance'],env:['Environment'],equip:['Equipment']};
const RT={manager:'All screens. Assign, approve or reject closures, run the simulator.',safety:'Own tickets plus Gas, PPE and Compliance risks. Correct, attach evidence, submit. Cannot approve, simulate or view the audit log.',env:'Own tickets plus Environment risks. Correct, attach evidence, submit. Cannot approve, simulate or view the audit log.',equip:'Own tickets plus Equipment risks. Correct, attach evidence, submit. Cannot approve, simulate or view the audit log.',auditor:'Read-only view of dashboard, tickets and audit log. Cannot assign, approve or edit.',worker:'Simple screen: I am safe, SOS, report a hazard with photo or video.'};
const vis=r=>S.u==='manager'||S.u==='auditor'||r.own===S.u||(CATS[S.u]||[]).includes(r.cat);
function access(){return `<div class="c" style="margin-top:12px"><h3>Your access: ${U[S.u]}</h3><p class="mu" style="margin:0">${RT[S.u]}</p></div>`}
function deny(w){w=T.en[w]||w;log('Access denied: '+w);S.view='denied';S.sel=null;S.dn=w;render()}
function denied(){return `<div class="c"><h2>Access denied</h2><p>Your role (${U[S.u]}) cannot open: ${e(S.dn)}. This attempt was written to the audit log.</p><button onclick="go('${S.u==='auditor'?'aud':S.u==='manager'?'dash':'tix'}')">Back to my home screen</button></div>`}
function newCap(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';S.cap=[...Array(5)].map(()=>c[Math.random()*c.length|0]).join('')}
function capSvg(){const r=n=>Math.random()*n;return `<svg width="170" height="52" viewBox="0 0 170 52" role="img" aria-label="CAPTCHA image"><rect width="170" height="52" rx="6" fill="var(--bg)" stroke="var(--bd)"/>${[...Array(6)].map(()=>`<line x1="${r(170)}" y1="${r(52)}" x2="${r(170)}" y2="${r(52)}" stroke="var(--mu)" stroke-width="1.2" opacity=".6"/>`).join('')}${[...S.cap].map((ch,i)=>`<text x="${16+i*29}" y="${30+r(8)}" transform="rotate(${r(36)-18} ${16+i*29} 30)" style="font-size:28px;font-weight:800;font-family:Georgia,serif">${ch}</text>`).join('')}</svg>`}
function refCap(){newCap();if(!$('capbox'))return;$('capbox').innerHTML=capSvg();$('cp').value='';$('lb').disabled=true}
function speak(){try{speechSynthesis.speak(new SpeechSynthesisUtterance([...S.cap].join(' ')))}catch(x){say('Read aloud is not available in this browser.')}}
const ZC={'Panel A':[90,80],'Panel B':[280,90],'Haul Road':[200,172],'CHP':[110,255],'Vent Shaft':[280,255]};
const SAMPLE='Inspection Report\nDate: 12/09/2026\nLocation: Ventilation Shaft, Mine A\n- Gas monitor calibration overdue, fix by 20/09/2026\n- Roof bolt gap pending repair\n- Fire extinguisher check non-compliant, deadline 25/09/2026';
function saveW(){FN.forEach((_,i)=>{const v=parseFloat($('w'+i).value);if(v>=0&&v<=100)W[i]=v/100});log('Score weights edited: '+W.map(x=>Math.round(x*100)).join('/'));say('Weights saved. All scores recalculated.')}
function cfg(){const sum=Math.round(W.reduce((a,b)=>a+b,0)*100),g={};S.R.forEach(r=>{if(r.fa)g[r.eng]=(g[r.eng]||0)+1});
return `<h2>${t('cfg')}</h2><div class="grid two"><div class="c"><h3>Risk score weights (design assumptions)</h3>${FN.map((n,i)=>`<div class="row"><label for="w${i}">${n} %</label><input id="w${i}" type="number" min="0" max="100" value="${Math.round(W[i]*100)}"><span></span></div>`).join('')}<p class="mu" style="font-size:13px">Total: ${sum}%${sum!==100?' (should be 100)':''}. Calibration needs real mine data.</p><button onclick="saveW()">Save weights</button></div>
</div>`}
function far(){const g={};S.R.filter(vis).forEach(r=>{g[r.eng]=g[r.eng]||[0,0];g[r.eng][0]++;if(r.fa)g[r.eng][1]++});return `<div class="c" style="margin-top:12px"><h3>False-alarm rate by detector</h3>${Object.entries(g).map(([k,v])=>`<div class="row"><span>${e(k)}</span><div class="bar"><i style="width:${v[1]/v[0]*100}%"></i></div><b>${Math.round(v[1]/v[0]*100)}%</b></div>`).join('')}</div>`}
function esc(r){if(!ovd(r))return '';const d=-r.dl;return `<div style="margin-top:10px;border-top:1px solid var(--bd);padding-top:8px"><h3>Escalation (simulated notifications)</h3><div class="mu" style="font-size:13px">Day 1 overdue: ${U[r.own]||'Officer'} reminded by SMS. Manager notified by WhatsApp.${d>=2?'<br>Day 2 overdue: Governance Admin notified by email.':''}<br>Current level: <b>${d>=2?'Admin':'Manager'}</b></div></div>`}
const DEV=[['Methane sensor M-01','Panel B','Online','1 min ago',97],['Methane sensor M-02','Panel A','Online','2 min ago',95],['Dust monitor D-07','Panel A','Online','4 min ago',88],['Vibration sensor V-03','CHP','Online','1 min ago',92],['CCTV Cam 12','Haul Road','Offline','3 h ago',0],['Fan RPM sensor F-01','Vent Shaft','Online','8 min ago',81]];
function hl(){const D=DEV;return `<h2>${t('hl')}</h2><div class="c wide"><table><tr><th>Device</th><th>Zone</th><th>Status</th><th>Last seen</th><th>Signal quality</th></tr>${D.map(d=>`<tr><td>${d[0]}</td><td>${d[1]}</td><td><span class="b ${d[2]==='Online'?'low':'crit'}">${d[2]}</span></td><td>${d[3]}</td><td>${d[4]}%</td></tr>`).join('')}</table><p class="mu" style="font-size:13px;margin:8px 0 0">Simulated device list. Zones with offline devices need manual inspection.</p></div>`}

function dcap(m){$('dm').innerHTML=m?`<div class="demo">${m} <button class="s" style="padding:2px 8px;margin-left:8px" onclick="dstop()">Stop</button></div>`:''}
function dstop(){DM++;dcap('')}
async function demo(){if(S.sim>=0)return;const id=++DM,w=ms=>new Promise(r=>setTimeout(r,ms)),ok=(z,n)=>S.P.filter(p=>p.z===z).slice(0,n).forEach(p=>{p.ok=1;p.at=Date.now()});S.em=null;S.nd=null;if(S.u!=='manager'){S.u=null;login('manager')}log('Guided demo started');
const st=[['Step 1: Manager dashboard. Khule risks aur compound-risk zones yahan dikhte hain.',()=>go('dash'),3500],
['Step 2: Sensor se methane spike aaya (simulated). AI pipeline chal rahi hai...',()=>{go('sim');inject('meth')},3300],
['Step 3: Naya ticket. Panel A me dust risk pehle se tha, isliye Compound risk laga aur score badha.',()=>{},4500],
['Step 4: Map par zone orange dashed hai. Ab Panel B me emergency declare hoti hai.',()=>{go('map');$('ez').value='Panel B';declare()},3500],
['Step 5: Roll-call: 2 worker safe, baaki ka pata nahi. Hara raasta safe evacuation route hai.',()=>{ok('Panel B',2);render()},4500],
['Step 6: Sab mil gaye. Ab Stand down ho sakta hai, aur incident report khud ban jayegi.',()=>{ok('Panel B',9);stand()},3000],

['Step 8: Sab ne acknowledge kiya. Withdrawal order: portal baadh ke khatre me hain, isliye route dusre exit se.',()=>{ndAck();ndAck();ndAck();ndWd()},5500],
['Step 9: Alert band. Report bani. Audit log me har action ek chain me hai, abhi chain theek hai.',()=>{ndClr();go('aud');vfy()},5000],
['Ab koi chupke se ek entry badalta hai... chain toot jati hai.',()=>{tamper();vfy()},4500],
['Demo khatam. Sab simulated data par chala. Ab aap khud try karo.',()=>{},3000]];
for(const [m,f,ms] of st){if(id!==DM)return;dcap(m);f();await w(ms)}dcap('')}
function toastEl(){$('tst').innerHTML=S.toast?`<div class="toast">${e(S.toast)}</div>`:''}
function say(m){S.toast=m;if(S.u)render();toastEl();clearTimeout(say.h);say.h=setTimeout(()=>{S.toast='';toastEl()},3200)}
function go(v){if(!ACC[S.u].includes(v))return deny(v);S.view=v;S.sel=null;render()}
function pick(id){const q=S.R.find(x=>x.id===id);if(!q||!vis(q))return deny('ticket '+id);S.sel=id;S.view='detail';render()}
function lang(){S.lang=S.lang==='en'?'hi':'en';render()}
function login(k){S.u=k;S.pend=null;S.fails=0;log('Logged in');S.view=k==='worker'?'sos':k==='auditor'?'aud':k==='manager'?'dash':'tix';render()}
function fail(msg,why){S.fails++;log(why);if(S.fails>=3){S.lock=Date.now()+15000;S.fails=0;msg='3 failed attempts. Locked for 15 seconds.';log('Lockout (15s)')}refCap();say(msg)}
function chk(){if(Date.now()<S.lock){say('Locked. Try again in '+Math.ceil((S.lock-Date.now())/1000)+' seconds.');return false}
if(($('cp').value||'').trim().toUpperCase()!==S.cap){fail('CAPTCHA incorrect. A new one was generated.','CAPTCHA failed');return false}return true}
function form(){if(!chk())return;const u=$('un').value.trim().toLowerCase(),p=$('pw').value;if(U[u]&&p==='demo123')return pend(u);fail('Invalid credentials.','Failed login (invalid credentials)')}
function quick(k){login(k)}
function out(){log('Logged out');S.u=null;newCap();render()}
function tog(){S.off=!S.off;log(S.off?'Went offline':'Back online');if(S.off)say('Offline: actions are saved locally and queued.');else if(S.q){const n=S.q;say('Syncing '+n+' queued action(s)...');setTimeout(()=>{S.q=0;log('Synced '+n+' queued actions');say('Synced '+n+' action(s). No conflicts.')},1200)}else render()}
function act(id,a){const r=S.R.find(x=>x.id===id),m=S.u==='manager';let msg='';const own=S.u===r.own;if(!({assign:m,ok:m,no:m,start:m||own,evid:m||own,submit:m||own,fa:m||own}[a])){log(r.id+': action "'+a+'" denied for '+U[S.u]);return say('Access denied: your role cannot do that.')}
if(a==='assign'){r.own=$('ow').value;r.dl=+$('dd').value;r.st=2;msg='Assigned to '+U[r.own]+', '+due(r)}
else if(a==='start'){r.st=3;msg='Correction started'}
else if(a==='evid'){const n=mediaFrom($('ef'),'fix');if(!n.length)return say('Choose an image or video up to 50 MB.');r.media=(r.media||[]).concat(n);r.evd=1;msg=n.length+' file(s) attached as evidence'}
else if(a==='submit'){if(!r.evd)return say('Blocked: attach evidence before submitting for verification.');r.st=4;msg='Submitted for verification'}
else if(a==='ok'){r.st=5;msg='Approved and closed with evidence'}
else if(a==='no'){r.st=3;r.evd=0;r.media=(r.media||[]).filter(x=>x.k!=='fix');msg='Rejected, sent back for correction'}
else if(a==='fa'){r.fa=$('fr').value;r.st=4;r.evd=1;msg='Marked false alarm ('+r.fa+'), sent for manager review'}
log(r.id+': '+msg+(S.off?' (queued offline)':''));if(S.off)S.q++;say(msg+(S.off?' (queued)':''))}
function inject(k){if(S.sim>=0)return;const d=SIM[k];S.sim=0;render();
const h=setInterval(()=>{S.sim++;if(S.sim>3){clearInterval(h);S.sim=-1;const r=mk('R-'+(++S.n),d[0],d[1],d[2],d[3],d[4],d[5],d[6],d[7],1,'',null,0,d[8]);S.R.push(r);log('Detected '+r.id+' via '+d[6]+', score '+sc(r));S.sel=r.id;S.view='detail'}render()},500)}
function stepper(st){const d=[2,3,3,4,5][st-1];return '<div class="step">'+['Detect','Explain','Assign','Correct','Verify'].map((l,i)=>`<div class="${i<d?'dn':i===d?'cu':''}">${l}</div>`).join('')+'</div>'}
function evid0(r){if(r.ev==='sensor'){const p=[...Array(20)].map((_,i)=>`${10+i*14},${90-(i>=14&&i<=17?60+(i-14)*4:12+(i*7%9))}`).join(' ');
return `<svg viewBox="0 0 300 110" width="100%"><line x1="10" x2="290" y1="40" y2="40" stroke="var(--o)" stroke-dasharray="4"/><text x="12" y="34">threshold</text><polyline fill="none" stroke="var(--acb)" stroke-width="2.5" points="${p}"/><circle cx="${10+15*14}" cy="${90-64}" r="6" fill="none" stroke="var(--r)" stroke-width="2"/><text x="150" y="16">anomaly window (simulated data)</text></svg>`}
if(r.ev==='cv')return `<svg viewBox="0 0 300 150" width="100%"><rect width="300" height="150" fill="var(--bg)"/><circle cx="150" cy="55" r="16" fill="var(--mu)"/><rect x="128" y="75" width="44" height="60" rx="8" fill="var(--mu)"/><rect x="112" y="30" width="76" height="70" fill="none" stroke="var(--r)" stroke-width="2.5"/><text x="112" y="24">no helmet (simulated CCTV frame)</text></svg>`;
if(r.ev==='nm')return `<p style="margin:0">Reported by ${e(r.by)}: "${e(r.txt)}"</p>`;
return `<pre style="margin:0;white-space:pre-wrap;font:13px/1.5 inherit">Extracted from report (OCR/NLP, simulated):\nLocation: ${e(r.z)}\nFinding: ${e(r.t)}\nOverdue items: 3\nDeadline missed: 12 days</pre>`}
function acts(r){const m=S.u==='manager',o=S.u===r.own;if(S.u==='auditor')return '<p class="mu">Read-only role. Auditors can view but not act.</p>';let h='';
if(r.st===1&&m)h+=`<select id="ow" aria-label="Owner">${['safety','env','equip'].map(k=>`<option value="${k}">${U[k]}</option>`).join('')}</select> <select id="dd" aria-label="Deadline"><option value="1">1 day</option><option value="3">3 days</option><option value="7">7 days</option></select> <button onclick="act('${r.id}','assign')">Assign</button> `;
if(r.st===2&&(o||m))h+=`<button onclick="act('${r.id}','start')">Start correction</button> `;
if(r.st===3&&(o||m))h+=(r.evd?'<span class="b low">Evidence attached ('+(r.media||[]).filter(x=>x.k==='fix').length+')</span> ':'')+`<label class="mu" style="font-size:13px">Photo / video proof <input type="file" id="ef" accept="image/*,video/*" multiple onchange="act('${r.id}','evid')"></label> `+`<button onclick="act('${r.id}','submit')">Submit for verification</button> `;
if(r.st<4&&(o||m))h+=`<select id="fr" aria-label="Reason"><option>Sensor glitch</option><option>Planned work</option><option>Duplicate</option><option>Other</option></select> <button class="s" onclick="act('${r.id}','fa')">Mark false alarm</button> `;
if(r.st===4&&m)h+=`<button onclick="act('${r.id}','ok')">Approve and close</button> <button class="d" onclick="act('${r.id}','no')">Reject</button> `;
if(r.st===4&&!m)h+='<span class="mu">Waiting for manager approval.</span> ';
return h||'<span class="mu">No action available for your role on this ticket.</span>'}
function detail(r){const s=sc(r);return `<button class="s" onclick="go('tix')">Back to tickets</button>
<h2 style="margin-top:12px">${e(r.id)} · ${e(r.t)} ${bd(r)}</h2>${stepper(r.st)}
<div class="grid two"><div class="c"><h3>Why this was raised</h3><p class="mu" style="margin:0 0 8px">Detected by ${e(r.eng)} in ${e(r.z)}. History: ${e(r.hist)}. Confidence (simulated): ${60+Math.round(r.f[0]*30)}%.</p>
${fx(r).map((v,i)=>`<div class="row"><span>${FN[i]}</span><div class="bar"><i style="width:${Math.round(v*W[i]/.35*100)}%"></i></div><b>${Math.round(v*W[i]*100)}</b></div>`).join('')}
${bo(r)?`<div class="row"><span style="color:var(--r)">Compound risk</span><div class="bar"><i style="width:100%;background:var(--r)"></i></div><b>+${bo(r)}</b></div><p class="mu" style="font-size:13px;margin:4px 0 8px">Raised because other open hazards share ${e(r.z)}: ${lk(r).map(x=>e(x.id)+' ('+e(x.cat)+')').join(', ')}. Overlapping hazards are more dangerous than each one alone.</p>`:''}<p class="mu" style="margin:8px 0 0;font-size:12px">Score ${s}/100 = sum of factor x weight + compound boost (${bo(r)}) + blind spot (${bs(r)}, offline device in zone). Personnel proximity uses the live worker count in ${e(r.z)} (${wc(r.z)}). Weights are design assumptions, not measured mine data.</p></div>
<div class="c"><h3>Evidence</h3>${evid(r)}</div></div>
<div class="c" style="margin-top:12px"><h3>Ticket</h3><p style="margin:0 0 8px">Status: <b>${ST[r.st]}</b> · Owner: ${r.own?U[r.own]:'not assigned'} · Deadline: ${due(r)} · Corrective action: ${CA[r.cat]}${r.fa?' · False alarm: '+e(r.fa):''}</p>${esc(r)}<div>${acts(r)}</div></div>`}
function dash(){const o=S.R.filter(r=>open(r)&&vis(r)),top=[...o].sort((a,b)=>sc(b)-sc(a)).slice(0,5),cats={};o.forEach(r=>cats[r.cat]=(cats[r.cat]||0)+1);const mx=Math.max(1,...Object.values(cats));
return `<div class="grid k">${[[t('open'),o.length],[t('crit'),o.filter(r=>sc(r)>=75).length],[t('ovd'),o.filter(ovd).length],[t('cls'),S.R.filter(r=>r.st===5&&vis(r)).length]].map(x=>`<div class="c"><div class="n">${x[1]}</div><div class="mu">${x[0]}</div></div>`).join('')}</div>
<div class="grid two" style="margin-top:12px"><div class="c"><h2>${t('top')}</h2><div class="wide"><table>${top.map(r=>`<tr class="cl" onclick="pick('${r.id}')"><td>${bd(r)}</td><td>${e(r.t)}<div class="mu" style="font-size:12px">${e(r.z)} · ${due(r)}</div></td></tr>`).join('')}</table></div></div>
<div class="c"><h2>${t('cat')}</h2>${Object.entries(cats).map(([k,v])=>`<div class="row"><span>${k}</span><div class="bar"><i style="width:${v/mx*100}%"></i></div><b>${v}</b></div>`).join('')}
<p class="mu" style="font-size:13px;margin:12px 0 0">Every risk follows: Detect → Explain → Assign → Correct → Verify.</p></div></div>
<div class="c" style="margin-top:12px"><h3>Why it matters (national context, not results of this system)</h3><p class="mu" style="margin:0">DGMS: 38 fatal accidents in Indian coal mines in 2024 (40 fatalities). FACTLY analysis of DGMS data: 119 serious accidents in 2024 and 41 fatal in 2025.</p></div>${cz()}<details class="c" style="margin-top:12px"><summary><b>${t('ho')}</b></summary>${ho()}</details>${ew()}${far()}${access()}`}
function map(){const Z=[['Panel A',20,20,170,100],['Panel B',210,20,170,120],['Haul Road',20,150,360,40],['CHP',20,205,170,90],['Vent Shaft',210,205,170,90]];
return `<h2>${t('map')}</h2>${emc()}${S.em?`<div class="banner" style="color:var(--tx)">${routeTxt()}</div>`:''}<div class="c"><svg viewBox="0 0 400 310" width="100%" role="img" aria-label="Schematic mine map">${Z.map(z=>`<rect x="${z[1]}" y="${z[2]}" width="${z[3]}" height="${z[4]}" rx="6" fill="var(--bg)" stroke="${S.em&&S.em.z===z[0]?'var(--r)':cmp(z[0])?'var(--o)':'var(--bd)'}" stroke-width="${S.em&&S.em.z===z[0]?4:cmp(z[0])?3:1}" ${cmp(z[0])?'stroke-dasharray="6 3"':''}/><text x="${z[1]+6}" y="${z[2]+14}">${z[0]} (${wc(z[0])} workers)</text>`).join('')}
${S.em?routeSvg():''}${S.R.filter(r=>open(r)&&vis(r)).map(r=>`<circle cx="${r.x}" cy="${r.y}" r="10" fill="var(--${{crit:'r',hi:'o',med:'y',low:'g'}[cl(sc(r))]})" stroke="#fff" stroke-width="2" style="cursor:pointer" tabindex="0" onclick="pick('${r.id}')" onkeydown="if(event.key==='Enter')pick('${r.id}')"><title>${e(r.t)}</title></circle>`).join('')}</svg>
<p class="mu" style="margin:6px 0 0;font-size:13px">Schematic layout (simulated). Click a marker to open the risk. Red ≥75, orange ≥55, yellow ≥35, green below. Dashed orange zone = compound risk (overlapping hazards). During an emergency the green route shows the safe way out.</p><button class="s" onclick="mvw()">Simulate worker movement</button></div>`}
function tix(){const L=S.R.filter(vis).sort((a,b)=>(open(b)-open(a))||sc(b)-sc(a));
return `<h2>${S.u==='manager'||S.u==='auditor'?t('tix'):'My tickets'}</h2><div class="c wide"><table><tr><th>Score</th><th>Risk</th><th>Status</th><th>Owner</th><th>Deadline</th></tr>${L.map(r=>`<tr class="cl" onclick="pick('${r.id}')"><td>${bd(r)}</td><td>${e(r.t)}</td><td>${ST[r.st]}</td><td>${r.own?U[r.own]:'-'}</td><td${ovd(r)?' style="color:var(--r);font-weight:700"':''}>${r.st===5?'-':due(r)}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">No tickets assigned to you yet.</td></tr>'}</table></div>`}
function sim(){const P=['Ingest','Validate','AI engine','Risk score'];
return `<h2>${t('sim')}</h2><div class="c"><p class="mu" style="margin-top:0">Inject a simulated event. It runs through the pipeline and creates a risk and ticket.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
${[['meth','Methane spike'],['helm','CCTV: no helmet'],['vib','Equipment vibration'],['doc','Overdue inspection report'],['dust','Dust anomaly']].map(x=>`<button onclick="inject('${x[0]}')" ${S.sim>=0?'disabled':''}>${x[1]}</button>`).join('')}</div>
<div class="pipe">${P.map((p,i)=>`<span class="${S.sim>=i?'on':''}">${p}</span>`).join('')}</div></div><div class="c" style="margin-top:12px"><h3>Natural disaster alert (simulated weather / seismic feed)</h3><p class="mu" style="margin:0 0 8px;font-size:13px">Production would take this from IMD and National Center for Seismology feeds. Here you trigger it by hand.</p><select id="nl" aria-label="Level"><option>Watch</option><option selected>Warning</option><option>Severe</option></select> <button onclick="ndSet('rain',$('nl').value)">Heavy rain</button> <button onclick="ndSet('quake',$('nl').value)">Earthquake</button> <button onclick="ndSet('storm',$('nl').value)">Lightning storm</button></div>`}

<div class="c"><label>Username<br><input id="un" placeholder="manager" autocomplete="off" style="width:100%"></label>
<label>Password<br><input id="pw" type="password" placeholder="demo123" style="width:100%"></label>
<div><div class="cap"><span id="capbox">${capSvg()}</span><button class="s" onclick="refCap()">Refresh</button><button class="s" onclick="speak()">Read aloud</button></div><input id="cp" placeholder="Type the characters" autocomplete="off" oninput="$('lb').disabled=!this.value.trim()" style="width:100%;margin-top:6px"></div><button id="lb" onclick="form()" disabled>${t('login')}</button><div class="mu" style="font-size:13px">${t('qd')}</div><div class="qd">${Object.entries(U).map(([k,v])=>`<button class="s" onclick="quick('${k}')">${v}</button>`).join('')}</div>
<button onclick="demo()">Guided demo (auto)</button><button class="s" onclick="lang()">English / हिन्दी</button>
<p class="mu" style="font-size:12px;margin:0">Demo authentication and CAPTCHA are simulated. Password for all demo users: demo123. Production would use SSO/MFA, a server-verified CAPTCHA (reCAPTCHA/hCaptcha), encrypted credentials and server-side sessions.</p></div></div>`}
function logo(){return '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M2 22 13 4l11 18z" fill="var(--acb)"/><circle cx="13" cy="15" r="3" fill="var(--bg)"/><circle cx="7" cy="19" r="2" fill="var(--bg)"/><circle cx="19" cy="19" r="2" fill="var(--bg)"/></svg>'}
function render(){const a=$('app');document.title='Mine Connect';
if(!S.u){a.innerHTML=loginH()+`<footer>Mine Connect · Prototype for SIH 2026 · KELVIN IMPACT · simulated data</footer>`;return}
const nav=ACC[S.u];
const cur=S.view==='detail'?'tix':S.view;
const body=S.view==='detail'?detail(S.R.find(r=>r.id===S.sel)):{dash,map,tix,sim,aud,denied,doc,hl,cfg:()=>cfg()+hl(),nm,ho,sos}[S.view]();
a.innerHTML=`<header><div class="brand">${logo()} Mine Connect</div><nav>${nav.map(n=>`<button class="${cur===n?'on':''}" onclick="go('${n}')">${t(n)}</button>`).join('')}</nav>
<span class="mu" style="font-size:13px">${U[S.u]} · ${S.mine}</span>
<button class="${S.off?'off':'s'}" onclick="tog()">${S.off?'Offline':'Online'}${S.q?`<span class="q">${S.q}</span>`:''}</button>
<button onclick="demo()">Guided demo</button><button class="s" onclick="lang()">EN / हि</button><button class="s" onclick="out()">${t('out')}</button></header>
<main>${S.nd?nb():''}${S.em?emb():''}<div class="banner">PROTOTYPE: simulated data. Risk weights are design assumptions, not measured mine data; calibration requires real mine data.</div>${body}</main>
<footer>Mine Connect · Prototype for SIH 2026 · KELVIN IMPACT · simulated data</footer>`}
newCap();render();
</script></body></html>
